<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard">

        <div class="sidebar">

            <div class="top">

                <a href="">
                    <img src="icons/view-dashboard.png" alt="dashboard-img" width="30">
                    <h5>Dashboard</h5>
                </a>

            </div>

            <div class="mid">

                <a href="">
                    <img src="icons/home.png" alt="" width="15">
                    <h6>Home</h6>
                </a>

                <a href="">
                    <img src="icons/card-account-details.png" alt="" width="15">
                    <h6>Profile</h6>
                </a>

                <a href="">
                    <img src="icons/message-reply-outline.png" alt="" width="15">
                    <h6>Messages</h6>
                </a>

                <a href="">
                    <img src="icons/history.png" alt="" width="15">
                    <h6>History</h6>
                </a>

                <a href="">
                    <img src="icons/file-multiple.png" alt="" width="15">
                    <h6>Tasks</h6>
                </a>
                

                <a href="">
                    <img src="icons/account-group.png" alt="" width="15">
                    <h6>Communities</h6>
                </a>

            </div>

            <div class="bottom">

                <a href="">
                    <img src="icons/cog.png" alt="" width="15">
                    <h6>Settings</h6>
                </a>

                <a href="">
                    <img src="icons/help-box-outline.png" alt="" width="15">
                    
                    <h6>Support</h6>
                </a>

                <a href="">
                    <img src="icons/shield-check.png" alt="" width="15">
                    <h6>Privacy</h6>
                </a>

            </div>

        </div>

        <div class="header">header</div>
        <div class="main-content">main</div>
    </div>
</body>
</html>
